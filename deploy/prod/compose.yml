name: wordmate

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-app: &app
  image: ghcr.io/word-mate/wordmate-backend:${IMAGE_TAG:-main}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: mysql://wordmate:${MYSQL_PASSWORD:?}@mysql:3306/wordmate
    VALKEY_URL: redis://valkey:6379
    # 학교 프록시만 앱에 붙는다. 프록시 주소가 다르면 .env의 TRUST_PROXY로 바꾼다
    TRUST_PROXY: ${TRUST_PROXY:-10.0.0.117}
  networks: [internal]
  logging: *logging

services:
  migrate:
    <<: *app
    command: ["dist/migrate.js"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - "3000:3000"
    volumes:
      # 1:1 문의 이미지 (UPLOAD_DIR 기본값 ./uploads). DB 백업과 함께 백업한다
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      MYSQL_DATABASE: wordmate
      MYSQL_USER: wordmate
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --ngram-token-size=2
      - --innodb-buffer-pool-size=1536M
      - --performance-schema=OFF
      - --max-connections=150
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [internal]
    logging: *logging

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    mem_limit: 640m
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: *logging

networks:
  internal:
    # 학교 서버 NIC MTU가 1400이라 기본값 1500이면 큰 응답 패킷이 버려져 외부 HTTPS 응답이 멈춘다
    driver_opts:
      com.docker.network.driver.mtu: "1400"
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mysql-data:
  valkey-data:
  uploads:
