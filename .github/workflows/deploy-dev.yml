name: Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/word-mate/wordmate-backend

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # 서버 설정(Environment 변수·시크릿 등록) 전에는 배포를 건너뛴다
    if: vars.DEV_DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
      url: https://${{ vars.DEV_DOMAIN }}/swagger-ui/index.html
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: SSH 설정
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host dev
            HostName ${{ secrets.DEV_SSH_HOST }}
            User ${{ secrets.DEV_SSH_USER }}
            Port ${{ secrets.DEV_SSH_PORT || 22 }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: 배포 파일 복사
        run: scp deploy/dev/compose.yml dev:wordmate/

      - name: 이미지 교체
        env:
          TAG: ${{ needs.image.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | ssh dev "docker login ghcr.io -u $ACTOR --password-stdin"
          ssh dev "cd wordmate \
            && IMAGE_TAG=$TAG docker compose pull app migrate; status=\$?; docker logout ghcr.io; [ \$status -eq 0 ] \
            && IMAGE_TAG=$TAG docker compose up -d --remove-orphans --wait app \
            && docker image prune -f"

      - name: 헬스 체크
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.DEV_DOMAIN }}/health"; then exit 0; fi
            sleep 5
          done
          ssh dev "cd wordmate && docker compose ps && docker compose logs --tail 100 app migrate"
          exit 1
